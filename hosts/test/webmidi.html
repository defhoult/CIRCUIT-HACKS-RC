<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web MIDI path test — Circuit Tracks LEDs</title>
<!-- The real app, from ../web/, with a fake Web MIDI behind it: proves the transport path (ports, open, keepalives, incoming messages)
     without hardware.  Serve hosts/ over HTTP:  http://localhost:8765/test/webmidi.html  -->
<base href="../web/">
<link rel="stylesheet" href="style.css">
</head>
<body class="stale">
<div id="app">
  <header>
    <h1>Circuit Tracks <span>LEDs</span></h1>
    <div id="status" class="status">starting…</div>
    <div id="dev" class="dev"></div>
    <div id="stats"></div>
  </header>
  <nav id="ports" aria-label="MIDI ports"></nav>
  <main id="panel"></main>
  <footer>
    <button id="full">Refresh</button>
    <button id="disconnect">Disconnect</button>
    <p>Test page: the app from <code>../web/</code> over a fake Web MIDI.</p>
  </footer>
</div>

<script>
// ---- a fake Web MIDI: one input / output pair named like the device, the output records what it is sent
const sent = [];
const input = { id: 'in-1', name: 'Circuit Tracks', onmidimessage: null };
const output = { id: 'out-1', name: 'Circuit Tracks', send: (b) => { sent.push(Array.from(b)); } };
const access = {
  inputs: new Map([[input.id, input]]),
  outputs: new Map([[output.id, output]]),
  onstatechange: null,
};
navigator.requestMIDIAccess = async (opts) => {
  window.__opts = opts;
  return access;
};
window.__sent = sent;

// ---- feed the real firmware messages (hosts/test/fixtures.json) once the app has listed the port and we click it.  The command base is
// forced to the build under test: `?v2` = "CT2" (0x32), default = the pre-fix "CT " (0x20), so both signatures are exercised.
async function run() {
  const v2 = new URLSearchParams(location.search).has('v2');
  const fx = await (await fetch('/test/fixtures.json')).json();
  const all = fx.cases.flatMap((c) => c.messages)
    .map((hx) => hx.slice(0, 8) + (v2 ? '32' : '20') + hx.slice(10));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  for (let i = 0; i < 40 && !document.querySelector('#ports button'); i++) await wait(25);
  const btn = document.querySelector('#ports button');
  window.__result = { listed: !!btn, name: btn && btn.textContent, opts: window.__opts, clicked: false, fed: 0 };
  if (!btn) return;
  btn.click();
  window.__result.clicked = true;
  await wait(50);
  for (const hx of all) {
    input.onmidimessage({ data: Uint8Array.from(hx.match(/../g).map((x) => parseInt(x, 16))) });
    window.__result.fed++;
    await wait(20);
  }
  await wait(400);
  // the app must be sending keepalives (F0 7D 43 54 20/32 00/01 seq F7) to our output: both bases until the device speaks, then only
  // the device's own — "CT2" (0x32) for this build, "CT " (0x20) for a unit that has not been reflashed.
  const isKA = (b, base) => b.length === 8 && b[0] === 0xF0 && b[1] === 0x7D && b[2] === 0x43 && b[3] === 0x54 && b[4] === base;
  const ka = sent.filter((b) => isKA(b, 0x20) || isKA(b, 0x32));
  const devBase = v2 ? 0x32 : 0x20;
  const kaDev = sent.filter((b) => isKA(b, devBase));
  const lastKA = [...sent].reverse().find((b) => isKA(b, 0x20) || isKA(b, 0x32));
  const dev = document.querySelector('#dev');
  // every cell must show what the last full frame says: lit = its word is not 0, and the colour is that word.  The fixture's frame is 69
  // codes (i % 0xBF) + 1 and one of them (LED 30, code 31) is black in the stock palette, so 68 lit is the correct answer, not 69.
  const words = fx.cases[fx.cases.length - 1].words;
  const els = [...document.querySelectorAll('.cell')].sort((a, b) => a.dataset.led - b.dataset.led);
  const css = (w) => `rgb(${(w >> 16) & 255},${(w >> 8) & 255},${w & 255})`;
  const wrong = els.map((el, i) => (el.hasAttribute('data-on') === (words[i] !== 0)
    && el.style.getPropertyValue('--c').trim() === css(words[i])) ? null : i).filter((i) => i !== null);
  window.__result.sent = sent.length;
  window.__result.keepalives = ka.length;
  window.__result.keepalivesDev = kaDev.length;
  window.__result.lastKA = lastKA ? lastKA[4] : null;
  window.__result.devBase = devBase;
  window.__result.devText = dev ? dev.textContent : null;
  window.__result.devClass = dev ? dev.className : null;
  window.__result.lit = els.filter((el) => el.hasAttribute('data-on')).length;
  window.__result.want = words.filter((w) => w !== 0).length;
  window.__result.wrong = wrong;
  window.__result.status = document.querySelector('#status').textContent;
  window.__result.stale = document.body.classList.contains('stale');
  // silence is normal (the firmware sends nothing while no LED changes and never acks a keepalive): 2.5 s without a frame must not dim
  await wait(2500);
  window.__result.staleAfterSilence = document.body.classList.contains('stale');
  // a port that disappears while in use must dim it
  input.state = 'disconnected';
  access.onstatechange && access.onstatechange();
  await wait(400);
  window.__result.staleAfterGone = document.body.classList.contains('stale');
  window.__result.statusAfterGone = document.querySelector('#status').textContent;
  const devOk = !!dev && dev.className.includes(v2 ? 'ok' : 'err')
    && dev.textContent.includes(v2 ? 'CT2' : 'PRE-FIX');
  window.__result.devOk = devOk;
  window.__result.ok = window.__result.listed && window.__result.opts && window.__result.opts.sysex === true
    && window.__result.clicked && ka.length >= 1 && kaDev.length >= 1 && lastKA && lastKA[4] === devBase && devOk
    && els.length === 69 && wrong.length === 0 && !window.__result.stale
    && !window.__result.staleAfterSilence && window.__result.staleAfterGone
    && /connected/.test(window.__result.status);
  document.title = (window.__result.ok ? 'PASS ' : 'FAIL ') + JSON.stringify(window.__result);
}
run();
</script>
<script type="module" src="app.js"></script>
</body>
</html>
